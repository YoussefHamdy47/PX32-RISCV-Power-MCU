---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: px32
description: PX32 Phase 1 core (RV32IMC_Zicsr_Zifencei, M-mode only)
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: C, version: "= 2.0" }
  - { name: Zca, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zifencei, version: "= 2.0" }
  - { name: Sm, version: "= 1.13.0" }

params:
  # Base & ISA mutability
  MXLEN: 32
  MUTABLE_MISA_M: false
  MUTABLE_MISA_C: false

  # Addressing & Memory
  PHYS_ADDR_WIDTH: 32
  M_MODE_ENDIANNESS: little # Default RISC-V + CVA6 behaviour
  PMA_GRANULARITY: 2 # 4-byte natural granule (32-bit OBI, byte enables)

  # Privilege & Modes
  # RVS (Supervisor) and RVU (User) are False
  # Therefore, only Machine Mode (Sm) is active
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  MISALIGNED_LDST: false

  # Exceptions & Traps(precise in-order pipeline)
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  MTVAL_WIDTH: 32 # full mtval (D-022)
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom # BASE is written, MODE is forced to Direct (D-022)
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low
  TRAP_ON_ILLEGAL_WLRL: false
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true

  # mtval and trap reporting behavior: PX32 reports a value for every class it raises (D-022)
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: true
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: true

  # Trap Handling (only direct mode (0) is supported for MTVEC)
  MTVEC_ACCESS: rw
  MTVEC_MODES: [0]
  MTVEC_BASE_ALIGNMENT_DIRECT: 4
  NUM_PMP_ENTRIES: 0

  # Identification (CVA6 Specifics)
  CONFIG_PTR_ADDRESS: 0x0
  MARCHID_IMPLEMENTED: false # marchid reads 0
  MIMPID_IMPLEMENTED: false # mimpid reads 0 (MIMPID parameter)
  MISA_CSR_IMPLEMENTED: true
  VENDOR_ID_BANK: 0x0 # mvendorid reads 0
  VENDOR_ID_OFFSET: 0x0
  MCOUNTINHIBIT_IMPLEMENTED: false # mcountinhibit traps (D-022)

