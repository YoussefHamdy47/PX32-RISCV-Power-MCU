# riscv-formal configuration for px_core (DECISIONS.md D-030). Used by scripts/riscv_formal.py,
# which copies it to <work>/cores/px32/checks.cfg next to the pinned riscv-formal checks.
#
# Paths name the core directory literally (cores/px32): genchecks derives @core@ by splitting the
# working directory on "/", which gives the whole path on Windows.
# ISA list: RV32IMC + Zba + Zbb + Zbs (upstream models at the pinned commit) + Zicond (project
# models insn_czero_eqz.v / insn_czero_nez.v); the driver writes the list file.
# Depths are BMC cycles from reset; an instruction check proves every instruction that retires
# at the last cycle. DIV/REM stay 17 cycles in EX, so their checks need more cycles. The unique
# check assumes a retirement at its trigger cycle: the first PX32 retirement after reset comes
# later than cycle 5, so the trigger is cycle 10 (with 5 the assumptions are unsatisfiable).

[options]
isa rv32imc_Zba_Zbb_Zbs_Zicond
nret 1
solver boolector

[depth]
insn            15
insn_div        30
insn_divu       30
insn_rem        30
insn_remu       30
reg        5    15
pc_fwd     5    15
pc_bwd     5    15
unique     1 10 15
causal     5    15
ill             15
cover      1    15
csrw            15
csrc_any   1    15
csrc_upcnt 1    15
csr_ill         15
# liveness: the next instruction retires within 70 cycles of any retirement (worst case: a
# redirect to a halfword-offset 32-bit target, two fetches, then a 17-cycle divide; memory
# waits bounded by PX32_FAIRNESS). Since step 2.2b (D-030 amendment) an interrupt may kill
# that divide in its last cycle, after which the handler is fetched and its first
# instruction may itself be a 17-cycle divide; a take clears MIE, so at most one kill
# happens between two retirements. Window 40 (before 2.2b) was exceeded by that case.
liveness   1 10 80

# CSRs checked through their CSR instructions (csrw: read value, written value, rd), with a
# consistency test where it applies. Only fully writable CSRs and the counters: the csrw check
# requires every written bit to read back, which WARL fields (mstatus, mtvec MODE, mepc[0],
# mcause) do not; those, misa and the read-only CSRs are proven against the D-022 model by
# tb/formal/px_csr_fv.sv (unbounded) instead.
[csrs]
mscratch        any
mtval
mcycle          upcnt
minstret        upcnt

# Addresses whose access must trap (D-022; Zicntr is not in the PX32 ISA, D-025): address,
# mode, access that traps
[illegal_csrs]
c00     m       rw
c01     m       rw
c02     m       rw
c80     m       rw
c82     m       rw
320     m       rw
306     m       rw
30a     m       rw
31a     m       rw
7a0     m       rw
7b0     m       rw
180     m       rw
003     m       rw
800     m       rw
fff     m       rw
f11     m       w
f12     m       w
f13     m       w
f14     m       w
f15     m       w
# step 2.2d (D-035, D-030 amendment): mscratchcsw exists only with U-mode (2.6); mintstatus is
# in the read-only address range
348     m       rw
fb1     m       w

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS

[defines liveness]
`define PX32_FAIRNESS

# csrc_any follows only instructions addressed to the CSR under test; an mscratchcswl swap
# (step 2.2d) changes mscratch through another address, so this check runs without swaps
# (D-030 amendment, D-035); the swap is checked by tb_px_csr, the px_csr harness and px_iss
[defines csrc_any]
`define PX32_NO_CSWL_SWAP

[verilog-files]
@basedir@/cores/px32/wrapper.sv

[script-sources]
plugin -i slang
read_slang -DRISCV_FORMAL -DRISCV_FORMAL_ALTOPS @basedir@/cores/px32/rtl/px_pkg.sv @basedir@/cores/px32/rtl/px_alu.sv @basedir@/cores/px32/rtl/px_regfile.sv @basedir@/cores/px32/rtl/px_decoder.sv @basedir@/cores/px32/rtl/px_decompressor.sv @basedir@/cores/px32/rtl/px_if_stage.sv @basedir@/cores/px32/rtl/px_csr_m.sv @basedir@/cores/px32/rtl/px_csr_clic.sv @basedir@/cores/px32/rtl/px_csr.sv @basedir@/cores/px32/rtl/px_mul.sv @basedir@/cores/px32/rtl/px_div.sv @basedir@/cores/px32/rtl/px_core.sv --top px_core

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
